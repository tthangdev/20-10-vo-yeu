<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gửi Vợ Yêu · 20/10</title>
<meta name="description" content="Lời chúc 20/10 gửi vợ yêu">
<meta property="og:title" content="Gửi Vợ Yêu · 20/10">
<meta property="og:description" content="Có một lá thư nhỏ đang chờ em mở…">
<meta property="og:image" content="images/us.jpg">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💌</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Be+Vietnam+Pro:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fbf5f0;
    --bg-2: #f6e6e1;
    --ink: #3b2a2c;
    --ink-soft: #7a6366;
    --rose: #c9506b;
    --rose-soft: #e8a3b2;
    --gold: #c49a5a;
    --paper: #fffdf9;
    --shadow: 0 20px 50px -20px rgba(80, 30, 40, .35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "Be Vietnam Pro", system-ui, sans-serif;
    color: var(--ink);
    background: radial-gradient(1200px 800px at 50% -10%, #fff 0%, var(--bg) 45%, var(--bg-2) 100%) fixed;
    min-height: 100vh;
    overflow-x: hidden;
    line-height: 1.7;
  }

  /* ---------- falling petals ---------- */
  #petals { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
  .petal {
    position: absolute; top: -40px;
    width: 12px; height: 14px;
    background: var(--rose-soft);
    border-radius: 60% 0 60% 0;
    opacity: .75;
    animation: fall linear forwards;
  }
  .petal.white { background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.04); }
  .petal.gold { background: var(--gold); width: 7px; height: 7px; border-radius: 50%; }
  @keyframes fall {
    to { transform: translate(var(--dx), 110vh) rotate(var(--rot)); }
  }

  /* ---------- envelope intro ---------- */
  #intro {
    position: fixed; inset: 0; z-index: 10;
    display: grid; place-items: center;
    background: radial-gradient(circle at 50% 40%, #fff7f3, #f3dcd6);
    transition: opacity 1s ease, visibility 1s;
    padding: 16px;
  }
  #intro.gone { opacity: 0; visibility: hidden; }
  .intro-wrap { text-align: center; }
  .intro-date {
    font-family: "Playfair Display", serif;
    letter-spacing: .3em; font-size: 13px; color: var(--ink-soft);
    text-transform: uppercase; margin-bottom: 28px;
  }
  .envelope {
    position: relative; width: min(320px, 80vw); aspect-ratio: 3 / 2;
    margin: 0 auto; cursor: pointer; perspective: 800px;
    filter: drop-shadow(0 18px 30px rgba(120, 40, 60, .25));
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float { 50% { transform: translateY(-8px); } }
  .env-body {
    position: absolute; inset: 0; border-radius: 6px;
    background: linear-gradient(160deg, #f4c6cf, #e79aab);
  }
  .env-letter {
    position: absolute; left: 8%; right: 8%; top: 10%; bottom: 8%;
    background: var(--paper); border-radius: 4px;
    display: grid; place-items: center;
    font-family: "Dancing Script", cursive; font-size: clamp(22px, 6vw, 30px); color: var(--rose);
    transition: transform .9s cubic-bezier(.2,.8,.2,1) .35s;
  }
  .env-front {
    position: absolute; inset: 0; border-radius: 6px; z-index: 2;
    clip-path: polygon(0 0, 50% 55%, 100% 0, 100% 100%, 0 100%);
    background: linear-gradient(170deg, #eda9b8, #e08ea2);
  }
  .env-flap {
    position: absolute; left: 0; right: 0; top: 0; height: 58%; z-index: 3;
    transform-origin: top;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    background: linear-gradient(180deg, #f1b4c1, #df8ea1);
    transition: transform .6s ease, z-index 0s .3s;
  }
  .seal {
    position: absolute; left: 50%; top: 50%; z-index: 4;
    width: 46px; height: 46px; margin: -23px 0 0 -23px;
    border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(circle at 35% 35%, #d8566f, #9e2c45);
    color: #fff; font-size: 20px;
    box-shadow: 0 3px 8px rgba(0,0,0,.25);
    transition: opacity .3s;
  }
  .envelope.open .seal { opacity: 0; }
  .envelope.open .env-flap { transform: rotateX(180deg); z-index: 0; }
  .envelope.open .env-letter { transform: translateY(-55%); }
  .intro-hint {
    margin-top: 30px; font-size: 14px; color: var(--ink-soft);
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .4; } }

  /* ---------- main ---------- */
  main { position: relative; z-index: 2; max-width: 980px; margin: 0 auto; padding: 56px 16px 80px; }
  .reveal { opacity: 0; transform: translateY(28px); transition: opacity 1s ease, transform 1s ease; }
  .reveal.in { opacity: 1; transform: none; }

  header.hero { text-align: center; margin-bottom: 48px; }
  .eyebrow {
    font-family: "Playfair Display", serif; font-size: 13px; letter-spacing: .35em;
    text-transform: uppercase; color: var(--gold);
  }
  h1 {
    font-family: "Dancing Script", cursive; font-weight: 700;
    font-size: clamp(52px, 13vw, 104px); line-height: 1.05;
    color: var(--rose); margin: 10px 0 6px;
  }
  .sub { font-family: "Playfair Display", serif; font-style: italic; font-size: clamp(17px, 3.5vw, 21px); color: var(--ink-soft); }

  .stage { display: grid; grid-template-columns: 1fr 1.05fr; gap: 56px; align-items: center; }
  @media (max-width: 820px) { .stage { grid-template-columns: 1fr; gap: 40px; } }

  .polaroid {
    background: #fff; padding: 14px 14px 64px; border-radius: 3px;
    box-shadow: var(--shadow);
    transform: rotate(-2.5deg);
    position: relative; max-width: 420px; margin: 0 auto;
    transition: transform .5s ease;
  }
  .polaroid:hover { transform: rotate(0deg) scale(1.02); }
  .polaroid img { display: block; width: 100%; height: auto; border-radius: 2px; }
  .polaroid figcaption {
    position: absolute; left: 0; right: 0; bottom: 16px; text-align: center;
    font-family: "Dancing Script", cursive; font-size: 26px; color: var(--ink);
  }
  .tape {
    position: absolute; top: -14px; left: 50%; width: 110px; height: 30px; margin-left: -55px;
    background: rgba(232, 163, 178, .55); transform: rotate(3deg);
    box-shadow: 0 1px 2px rgba(0,0,0,.06);
  }

  .letter {
    background: var(--paper);
    border-radius: 6px; padding: clamp(26px, 5vw, 44px);
    box-shadow: var(--shadow);
    position: relative;
    background-image: repeating-linear-gradient(transparent 0 33px, rgba(201, 80, 107, .08) 33px 34px);
  }
  .letter::before {
    content: ""; position: absolute; top: 0; bottom: 0; left: clamp(14px, 3vw, 24px); width: 1px;
    background: rgba(201, 80, 107, .25);
  }
  .letter .hi { font-family: "Dancing Script", cursive; font-size: 32px; color: var(--rose); margin-bottom: 8px; }
  .letter p { font-size: 16px; margin-bottom: 14px; min-height: 1em; }
  .letter p .caret { display: inline-block; width: 1px; height: 1.1em; background: var(--rose); vertical-align: -3px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .sign { text-align: right; margin-top: 22px; font-family: "Dancing Script", cursive; font-size: 26px; color: var(--ink); }
  .sign small { display: block; font-family: "Be Vietnam Pro", sans-serif; font-size: 13px; color: var(--ink-soft); }


  .heart-zone { margin-top: 80px; text-align: center; }
  .big-heart {
    font-size: 72px; background: none; border: 0; cursor: pointer;
    animation: beat 1.3s ease-in-out infinite; line-height: 1;
    -webkit-tap-highlight-color: transparent;
  }
  @keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.18); } 30% { transform: scale(1); } 45% { transform: scale(1.12); } }
  .heart-zone p { color: var(--ink-soft); font-size: 14px; margin-top: 10px; }
  #love-count { font-family: "Playfair Display", serif; font-size: 20px; color: var(--rose); margin-top: 6px; min-height: 30px; }
  .pop {
    position: fixed; pointer-events: none; z-index: 20; font-size: 22px;
    animation: pop 1.4s ease-out forwards;
  }
  @keyframes pop { to { transform: translate(var(--dx), -160px) scale(.6); opacity: 0; } }

  footer { text-align: center; margin-top: 70px; font-size: 13px; color: var(--ink-soft); }

  #music {
    position: fixed; right: 16px; bottom: 16px; z-index: 5;
    width: 46px; height: 46px; border-radius: 50%; border: 0; cursor: pointer;
    background: #fff; box-shadow: var(--shadow); font-size: 20px;
  }
  #music.on { animation: spin 4s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .reveal { opacity: 1; transform: none; }
  }
</style>
</head>
<body>

<div id="petals" aria-hidden="true"></div>

<section id="intro" aria-label="Mở thư">
  <div class="intro-wrap">
    <div class="intro-date">20 · 10 · 2026</div>
    <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Chạm để mở thư">
      <div class="env-body"></div>
      <div class="env-letter">Gửi vợ yêu ♡</div>
      <div class="env-front"></div>
      <div class="env-flap"></div>
      <div class="seal">♥</div>
    </div>
    <p class="intro-hint">Chạm vào lá thư để mở nhé em ✨</p>
  </div>
</section>

<main>
  <header class="hero reveal">
    <div class="eyebrow">Ngày Phụ nữ Việt Nam · 20/10</div>
    <h1>Gửi Vợ Yêu</h1>
    <p class="sub">người con gái anh chọn để đi cùng suốt đời</p>
  </header>

  <section class="stage">
    <figure class="polaroid reveal">
      <span class="tape"></span>
      <img src="images/us.jpg" alt="Anh và em trong ngày cưới, giữa mưa hoa giấy" loading="eager">
      <figcaption>Ngày mình về chung một nhà ♡</figcaption>
    </figure>

    <article class="letter reveal" id="letter">
      <div class="hi">Vợ yêu của anh,</div>
      <p data-text="Hôm nay là 20/10, nhưng với anh, ngày nào có em cũng là một ngày đáng để chúc mừng."></p>
      <p data-text="Cảm ơn em vì đã nắm tay anh giữa cơn mưa hoa giấy hôm ấy, và vẫn nắm chặt như thế qua từng ngày bình thường sau này. Nụ cười của em trong tấm ảnh này là thứ anh muốn giữ mãi."></p>
      <p data-text="Chúc em luôn xinh đẹp, khoẻ mạnh, vui vẻ và được yêu thương thật nhiều. Phần yêu thương ấy, anh xin nhận hết về mình lo nhé."></p>
      <p data-text="Anh yêu em, hôm nay và mãi về sau. 💕"></p>
      <div class="sign">Chồng của em<small>ký tên bằng cả trái tim</small></div>
    </article>
  </section>


  <section class="heart-zone reveal">
    <button class="big-heart" id="heart" aria-label="Gửi tim">❤️</button>
    <p>Bấm vào trái tim nếu em cũng yêu anh 🥰</p>
    <div id="love-count" aria-live="polite"></div>
  </section>

  <footer>Made with ♥ by chồng iuu · 20/10/2026</footer>
</main>

<button id="music" aria-label="Bật/tắt nhạc" title="Nhạc nền">🎵</button>

<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* falling petals */
  const petals = document.getElementById('petals');
  function spawnPetal() {
    const p = document.createElement('span');
    const r = Math.random();
    p.className = 'petal' + (r < .45 ? ' white' : r < .55 ? ' gold' : '');
    p.style.left = Math.random() * 100 + 'vw';
    p.style.setProperty('--dx', (Math.random() * 160 - 80) + 'px');
    p.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
    const d = 7 + Math.random() * 7;
    p.style.animationDuration = d + 's';
    const s = .6 + Math.random() * .8;
    p.style.scale = s;
    petals.appendChild(p);
    setTimeout(() => p.remove(), d * 1000);
  }
  if (!reduce) setInterval(spawnPetal, 380);

  /* scroll reveal */
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
  }), { threshold: .15 });

  /* typewriter for the letter */
  let typed = false;
  async function typeLetter() {
    if (typed) return; typed = true;
    const ps = document.querySelectorAll('#letter p[data-text]');
    if (reduce) { ps.forEach(p => p.textContent = p.dataset.text); return; }
    const caret = document.createElement('span'); caret.className = 'caret';
    ps.forEach(p => { p.textContent = p.dataset.text; p.style.minHeight = p.offsetHeight + 'px'; p.textContent = ''; });
    for (const p of ps) {
      const chars = [...p.dataset.text];
      p.textContent = ''; p.appendChild(caret);
      for (const ch of chars) {
        caret.before(ch);
        await new Promise(r => setTimeout(r, ch === ',' || ch === '.' ? 180 : 32));
      }
      await new Promise(r => setTimeout(r, 350));
    }
    caret.remove();
  }
  const letterIO = new IntersectionObserver(es => {
    if (es[0].isIntersecting) { setTimeout(typeLetter, 600); letterIO.disconnect(); }
  }, { threshold: .3 });

  /* envelope */
  const intro = document.getElementById('intro');
  const env = document.getElementById('envelope');
  function openEnvelope() {
    if (env.classList.contains('open')) return;
    env.classList.add('open');
    startMusic();
    burst(innerWidth / 2, innerHeight / 2, 18);
    setTimeout(() => {
      intro.classList.add('gone');
      document.querySelectorAll('.reveal').forEach(el => io.observe(el));
      letterIO.observe(document.getElementById('letter'));
    }, 1500);
  }
  env.addEventListener('click', openEnvelope);
  env.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openEnvelope(); } });

  /* heart button */
  const msgs = ['Anh cũng yêu em! 💕', 'Yêu em nhiều hơn nữa 😘', 'Nhiều hơn cả sao trời ✨', 'Mãi mãi luôn nhé 💍', 'Vợ anh là nhất! 🥰'];
  let n = 0;
  function burst(x, y, count = 10) {
    const icons = ['💖', '💕', '🌸', '✨', '💗'];
    for (let i = 0; i < count; i++) {
      const s = document.createElement('span');
      s.className = 'pop';
      s.textContent = icons[i % icons.length];
      s.style.left = x + 'px'; s.style.top = y + 'px';
      s.style.setProperty('--dx', (Math.random() * 240 - 120) + 'px');
      s.style.animationDelay = (Math.random() * .2) + 's';
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 1700);
    }
  }
  document.getElementById('heart').addEventListener('click', e => {
    n++;
    const r = e.currentTarget.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2);
    document.getElementById('love-count').textContent = msgs[(n - 1) % msgs.length] + '  ×' + n;
  });

  /* soft music box melody via Web Audio (no external file) */
  let ctx, playing = false, timer;
  const btn = document.getElementById('music');
  const notes = [ // simple tender melody: [semitones from A4, beats]
    [3,1],[7,1],[10,1],[15,2],[14,1],[10,1],[12,2],[7,2],
    [5,1],[8,1],[12,1],[17,2],[15,1],[12,1],[14,3],[-99,1],
    [3,1],[7,1],[10,1],[15,2],[17,1],[19,1],[20,2],[15,2],
    [14,1],[12,1],[10,1],[12,1],[14,1],[7,1],[10,3],[-99,1]
  ];
  function tone(freq, t, dur) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(.12, t + .02);
    g.gain.exponentialRampToValueAtTime(.001, t + dur + .8);
    o.connect(g).connect(ctx.destination);
    o.start(t); o.stop(t + dur + .9);
  }
  function loop() {
    const beat = .42; let t = ctx.currentTime + .05;
    for (const [s, b] of notes) {
      if (s > -50) {
        const f = 440 * Math.pow(2, s / 12);
        tone(f, t, b * beat);
        tone(f / 2, t, b * beat * .8);
      }
      t += b * beat;
    }
    timer = setTimeout(loop, (t - ctx.currentTime) * 1000);
  }
  function startMusic() {
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      ctx.resume(); if (!playing) { playing = true; btn.classList.add('on'); loop(); }
    } catch (_) {}
  }
  function stopMusic() { playing = false; btn.classList.remove('on'); clearTimeout(timer); ctx && ctx.suspend(); }
  btn.addEventListener('click', () => playing ? stopMusic() : startMusic());
})();
</script>
</body>
</html>
